{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <div class="auth-header-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Access your secure online banking portal</p>
    </div>

    <div class="auth-card">
        <form method="POST" action="{{ url_for('login') }}" novalidate>
            <div class="form-group">
                <label for="account_number" class="form-label">
                    Account Number
                    <span class="form-label-desc">(6-digit account ID)</span>
                </label>
                <div class="input-group has-icon">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </span>
                    <input type="text"
                           id="account_number"
                           name="account_number"
                           class="form-control is-mono"
                           placeholder="e.g. 104523"
                           data-numeric="true"
                           maxlength="6"
                           value="{{ request.args.get('acc', request.form.get('account_number', '')) }}"
                           required
                           autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="pin" class="form-label">
                    Secret PIN
                    <span class="form-label-desc">(4-digit security PIN)</span>
                </label>
                <div class="input-group has-icon">
                    <span class="input-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </span>
                    <input type="password"
                           id="pin"
                           name="pin"
                           class="form-control is-mono"
                           placeholder="••••"
                           data-numeric="true"
                           maxlength="4"
                           required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                <span>Sign In Securely</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Open an account now &rarr;</a>
        </div>
    </div>
</div>
{% endblock %}
